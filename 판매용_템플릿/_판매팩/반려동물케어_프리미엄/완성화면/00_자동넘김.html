<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>반려동물케어 프리미엄 · 모던네이비 — 자동 넘김</title>

    font:700 15px/1.4 Paperlogy,Pretendard,'Malgun Gothic',sans-serif;
    display:flex;justify-content:space-between}
</style></head><body>
<iframe id="f" src="pages/HO0101.html"></iframe>
<div class="tag"><span id="t">홈</span><span>반려동물케어 프리미엄 · 모던네이비</span></div>
<script>
/* 한 장에 4초. 화면 녹화만 눌러도 쓸 수 있는 길이다. */
const 장 = [{"f":"HO0101.html","t":"홈"},{"f":"PL0101.html","t":"반려견 등록"},{"f":"RE0201.html","t":"정기 등원 요일 선택"},{"f":"MY0201.html","t":"회차권 현황"},{"f":"AT0101.html","t":"오늘 등원 현황판"},{"f":"NW0101.html","t":"알림장 작성"},{"f":"HL0101.html","t":"백신 만료 대시보드"},{"f":"MG0101.html","t":"정원·요금 설정"},{"f":"CS0101.html","t":"자주 묻는 질문"}];
let i = 0;
setInterval(() => {
  i = (i + 1) % 장.length;
  document.getElementById("f").src = "pages/" + 장[i].f;
  document.getElementById("t").textContent = 장[i].t;
}, 4000);
</script></body></html>
