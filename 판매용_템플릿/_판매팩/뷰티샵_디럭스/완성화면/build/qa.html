<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA — 전체 화면 점검</title>
<style>body{font:13px/1.6 system-ui;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:3px 8px;text-align:left}
.bad{background:#fdd}iframe{width:1280px;height:900px;border:0;position:fixed;left:-4000px}</style>
</head><body>
<h1>전체 화면 점검</h1>
<p>가로 스크롤 · 끊어진 링크 · undefined · <b>이미지 자리 비율</b>(적어 둔 크기와 실제 모양이 같은지)를 봅니다.</p>
<p id="s">준비 중…</p><div id="r"></div><iframe id="f"></iframe>
<script>
const W = [1280, 768, 390];
(async () => {
  const ids = await (await fetch('/build/pageids.json')).json();
  const f = document.getElementById('f');
  const rows = [];
  for (const id of ids) {
    const res = { id, issues: [] };
    for (const w of W) {
      f.style.width = w + 'px';
      await new Promise((ok) => { f.onload = ok; f.src = '/pages/' + id + '.html'; });
      await new Promise((r) => setTimeout(r, 30));
      const d = f.contentDocument;
      const sw = d.documentElement.scrollWidth, cw = d.documentElement.clientWidth;
      if (sw > cw + 1) res.issues.push(`가로overflow@${w}(${sw}>${cw})`);

      /* 이미지 자리 — 적어 둔 권장 크기의 비율을 실제로 지키는지 */
      d.querySelectorAll('.ph').forEach((e) => {
        const m = (e.textContent || e.getAttribute('title') || '').match(/(\d{2,4})×(\d{2,4})/);
        if (!m) return;
        const r = e.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const want = (+m[1]) / (+m[2]), got = r.width / r.height;
        if (Math.abs(want - got) / want > 0.04) {
          res.issues.push(`비율@${w} ${m[1]}×${m[2]} 인데 ${Math.round(r.width)}×${Math.round(r.height)}`);
        }
      });

      if (w === 1280) {
        if (!(d.title || '').trim()) res.issues.push('title 없음');
        if (d.body.innerHTML.includes('undefined')) res.issues.push('undefined 문자열');
        res.links = [...new Set([...d.querySelectorAll('a[href$=".html"]')].map((a) => a.getAttribute('href')))];
      }
    }
    res.issues = [...new Set(res.issues)];
    rows.push(res);
    document.getElementById('s').textContent = `${rows.length}/${ids.length} 검사`;
  }
  const set = new Set(ids.map((i) => i + '.html'));
  const broken = [];
  rows.forEach((r) => (r.links || []).forEach((h) => { if (!h.startsWith('..') && !set.has(h)) broken.push(r.id + ' → ' + h); }));
  const badRows = rows.filter((r) => r.issues.length);
  document.getElementById('r').innerHTML =
    `<h2>문제 ${badRows.length}건</h2><table><tr><th>화면</th><th>문제</th></tr>` +
    badRows.map((r) => `<tr class="bad"><td>${r.id}</td><td>${r.issues.join(' · ')}</td></tr>`).join('') +
    `</table><h2>끊어진 링크 ${broken.length}건</h2><pre>${broken.join('\n') || '없음'}</pre>`;
  window.__QA = { bad: badRows, broken };
  document.getElementById('s').textContent = `완료 — 문제 ${badRows.length}건, 끊어진 링크 ${broken.length}건`;
})();
</script></body></html>
