<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>중고거래 디럭스 · 코럴선셋 — 자동 넘김</title>
<style>
  html,body{margin:0;height:100%;background:#F0EFEB;overflow:hidden}
  iframe{width:100%;height:calc(100% - 44px);border:0;display:block}
  .tag{height:44px;box-sizing:border-box;padding:11px 18px;background:#1C2B22;color:#fff;
    font:700 15px/1.4 Paperlogy,Pretendard,'Malgun Gothic',sans-serif;
    display:flex;justify-content:space-between}
</style></head><body>
<iframe id="f" src="pages/HO-01.html"></iframe>
<div class="tag"><span id="t">홈</span><span>중고거래 디럭스 · 코럴선셋</span></div>
<script>
/* 한 장에 4초. 화면 녹화만 눌러도 쓸 수 있는 길이다. */
const 장 = [{"f":"HO-01.html","t":"홈"},{"f":"SE-02.html","t":"매물 목록"},{"f":"SL-01.html","t":"판매글 작성"},{"f":"BS-01.html","t":"끌올하기"},{"f":"CH-02.html","t":"채팅방"},{"f":"PA-05.html","t":"거래 진행 상태"},{"f":"MY-04.html","t":"거래 후기 쓰기"},{"f":"AD-01.html","t":"신고 처리 대기열"},{"f":"CS-01.html","t":"자주 묻는 질문"}];
let i = 0;
setInterval(() => {
  i = (i + 1) % 장.length;
  document.getElementById("f").src = "pages/" + 장[i].f;
  document.getElementById("t").textContent = 장[i].t;
}, 4000);
</script></body></html>
